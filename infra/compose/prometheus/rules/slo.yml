# SLOs from the assignment: p95 reads < 200 ms, p95 writes < 500 ms, 99.95 % availability.
groups:
  - name: sli-recording
    rules:
      - record: sli:http_requests:rate5m
        expr: sum(rate(http_request_duration_seconds_count{job="api"}[5m]))
      - record: sli:http_errors:rate5m
        expr: sum(rate(http_request_duration_seconds_count{job="api",status_code=~"5.."}[5m])) or vector(0)
      - record: sli:http_error_ratio:rate5m
        expr: sli:http_errors:rate5m / clamp_min(sli:http_requests:rate5m, 1e-9)
      - record: sli:http_error_ratio:rate1h
        expr: |
          (sum(rate(http_request_duration_seconds_count{job="api",status_code=~"5.."}[1h])) or vector(0))
          / clamp_min(sum(rate(http_request_duration_seconds_count{job="api"}[1h])), 1e-9)
      - record: sli:http_read_latency:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="api",method="GET"}[5m])))
      - record: sli:http_write_latency:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="api",method=~"POST|PUT|PATCH|DELETE"}[5m])))

  - name: slo-alerts
    rules:
      # Multi-window burn rate (Google SRE workbook): 99.95 % => 0.05 % error budget.
      - alert: ErrorBudgetFastBurn
        expr: sli:http_error_ratio:rate1h > (14.4 * 0.0005) and sli:http_error_ratio:rate5m > (14.4 * 0.0005)
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "API burning error budget 14x faster than sustainable (2% of monthly budget per hour)"
      - alert: ReadLatencySLOBreach
        expr: sli:http_read_latency:p95_5m > 0.2
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "p95 read latency {{ $value | humanizeDuration }} > 200ms" }
      - alert: WriteLatencySLOBreach
        expr: sli:http_write_latency:p95_5m > 0.5
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "p95 write latency {{ $value | humanizeDuration }} > 500ms" }

  - name: platform
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "{{ $labels.job }} is down" }
      - alert: PaymentGatewayCircuitOpen
        expr: max(circuit_breaker_open) > 0
        for: 1m
        labels: { severity: page }
        annotations: { summary: "Payment gateway circuit breaker is open; bookings are failing fast" }
      - alert: DeadLetterQueueNotEmpty
        expr: max(queue_jobs{queue="dead-letter",state="waiting"}) > 0
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: "{{ $value }} jobs exhausted retries and need attention" }
      - alert: OutboxBacklog
        expr: max(outbox_unpublished_events) > 100
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: "Outbox relay is lagging ({{ $value }} events)" }
      - alert: WebhookSignatureFailures
        expr: sum(rate(payment_webhooks_total{outcome="bad_signature"}[10m])) > 0.05
        for: 10m
        labels: { severity: ticket, security: "true" }
        annotations: { summary: "Sustained invalid webhook signatures (possible forgery attempts)" }
      - alert: LoginFailureSpike
        expr: sum(rate(auth_events_total{event="login",outcome="failure"}[5m])) > 2
        for: 5m
        labels: { severity: ticket, security: "true" }
        annotations: { summary: "Elevated failed logins (credential stuffing?)" }
      - alert: RefreshTokenReuse
        expr: sum(increase(auth_events_total{event="refresh",outcome="reuse"}[15m])) > 0
        labels: { severity: ticket, security: "true" }
        annotations: { summary: "Refresh token reuse detected (possible token theft)" }
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: "Postgres connection usage above 80%" }
