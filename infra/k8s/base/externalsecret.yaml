# Secrets live in AWS Secrets Manager (KMS-encrypted, rotation-capable) and are synced
# into a K8s Secret by External Secrets Operator. Nothing secret is committed to git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: amrutam-secrets
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: amrutam-secrets, creationPolicy: Owner }
  dataFrom:
    - extract: { key: amrutam/prod/app }   # DATABASE_URL, DATABASE_READ_URL, REDIS_URL, JWT_*, ENCRYPTION_*, BLIND_INDEX_KEY, PAYMENT_WEBHOOK_SECRET
