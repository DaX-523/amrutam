# AWS Load Balancer Controller: internet-facing ALB, TLS 1.2+ only, HTTP->HTTPS, WAF attached.
# Only /v1 and /docs are exposed; /metrics and /health stay cluster-internal.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amrutam-api
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:000000000000:certificate/replace-me
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-south-1:000000000000:regional/webacl/amrutam/replace-me
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=30,routing.http.drop_invalid_header_fields.enabled=true
spec:
  ingressClassName: alb
  rules:
    - host: api.amrutam.global
      http:
        paths:
          - { path: /v1, pathType: Prefix, backend: { service: { name: amrutam-api, port: { name: http } } } }
          - { path: /docs, pathType: Prefix, backend: { service: { name: amrutam-api, port: { name: http } } } }
