apiVersion: v1
kind: ServiceAccount
metadata:
  name: amrutam-app
  annotations:
    # IRSA: pods get short-lived AWS credentials scoped to the app role (S3 bucket, KMS,
    # Secrets Manager read). No static AWS keys anywhere. Patched per environment.
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/amrutam-app
automountServiceAccountToken: true
