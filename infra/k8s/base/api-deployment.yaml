apiVersion: apps/v1
kind: Deployment
metadata:
  name: amrutam-api
  labels: { app.kubernetes.io/name: amrutam-api, app.kubernetes.io/component: api }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 25% }   # zero-downtime deploys
  selector:
    matchLabels: { app.kubernetes.io/name: amrutam-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: amrutam-api, app.kubernetes.io/component: api }
    spec:
      serviceAccountName: amrutam-app
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # Spread across AZs and nodes: losing one AZ keeps 2/3 of capacity (99.95% target).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app.kubernetes.io/name: amrutam-api } }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: amrutam-api } }
      containers:
        - name: api
          image: amrutam-api
          imagePullPolicy: IfNotPresent
          args: ["node", "--import", "./dist/infra/telemetry.js", "dist/server.js"]
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: amrutam-config }
            - secretRef: { name: amrutam-secrets }
          env:
            - { name: SERVICE_NAME, value: amrutam-api }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            # Let the load balancer deregister the pod before Fastify stops accepting.
            preStop: { sleep: { seconds: 5 } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
