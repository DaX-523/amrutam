# Runs before the new Deployment is rolled out (CI applies and waits for it first).
# Kysely's migrator holds a Postgres advisory lock, so concurrent runs are safe.
# Migrations are expand/contract (backward compatible) so old pods keep working mid-rollout.
apiVersion: batch/v1
kind: Job
metadata:
  name: amrutam-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: amrutam-migrate }
    spec:
      restartPolicy: Never
      serviceAccountName: amrutam-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: amrutam-api
          args: ["node", "dist/db/migrate.js"]
          envFrom:
            - secretRef: { name: amrutam-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
