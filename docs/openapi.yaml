          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        doctorId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        patientId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        items:
          type: array
          items:
            type: object
            properties:
              medicine:
                type: string
                minLength: 2
                maxLength: 200
              dosage:
                type: string
                minLength: 1
                maxLength: 100
                description: e.g. "500 mg", "1 tsp"
              frequency:
                type: string
                minLength: 1
                maxLength: 100
                description: e.g. "twice daily after meals"
              durationDays:
                type: integer
                minimum: 1
                maximum: 365
              instructions:
                type: string
                maxLength: 500
            required:
              - medicine
              - dosage
              - frequency
              - durationDays
            additionalProperties: false
        advice:
          type:
            - string
            - "null"
        followUpDate:
          type:
            - string
            - "null"
        contentHash:
          type: string
          description: SHA-256 of the canonical prescription content (integrity)
        pdfStatus:
          type: string
          enum:
            - pending
            - ready
            - failed
        createdAt:
          type: string
      required:
        - id
        - consultationId
        - doctorId
        - patientId
        - items
        - advice
        - followUpDate
        - contentHash
        - pdfStatus
        - createdAt
      additionalProperties: false
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        email:
          type: string
        role:
          type: string
          enum:
            - patient
            - doctor
            - admin
        status:
          type: string
        mfaEnabled:
          type: boolean
        createdAt:
          type: string
        profile:
          type: object
          properties:
            fullName:
              type: string
            phone:
              type:
                - string
                - "null"
            dateOfBirth:
              type:
                - string
                - "null"
            gender:
              anyOf:
                - type: string
                  enum:
                    - female
                    - male
                    - other
                    - undisclosed
                - type: "null"
            city:
              type:
                - string
                - "null"
            consentVersion:
              type:
                - string
                - "null"
          required:
            - fullName
            - phone
            - dateOfBirth
            - gender
            - city
            - consentVersion
          additionalProperties: false
      required:
        - id
        - email
        - role
        - status
        - mfaEnabled
        - createdAt
        - profile
      additionalProperties: false
