          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                role:
                  default: patient
                  type: string
                  enum:
                    - patient
                    - doctor
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 120
                phone:
                  type: string
                  pattern: ^\+?[1-9]\d{7,14}$
                consent:
                  type: boolean
                  enum:
                    - true
              required:
                - email
                - password
                - fullName
                - consent
              additionalProperties: false
      parameters:
        - schema:
            type: string
            minLength: 8
            maxLength: 128
          in: header
          name: idempotency-key
          required: true
          description: Client-generated unique key (UUID recommended). Retries with the
            same key are safe.
