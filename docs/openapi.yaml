openapi: 3.1.0
info:
  title: Amrutam Telemedicine API
  version: 1.0.0
  description: Auth (MFA/RBAC), doctor discovery & availability, booking saga,
    consultations, prescriptions, payments, audit and admin analytics. All
    mutating endpoints require an `Idempotency-Key` header unless stated
    otherwise. Errors use RFC 7807 problem+json.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProblemInput:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        code:
          type: string
        detail:
          type: string
        requestId:
          type: string
        errors: {}
      required:
        - type
        - title
        - status
        - code
        - detail
        - requestId
      description: RFC 7807 problem details
    TokenPairInput:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    LoginResponseInput:
      oneOf:
        - type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            tokenType:
              type: string
              const: Bearer
            expiresIn:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            status:
              type: string
              const: authenticated
            mfaEnrollmentRequired:
              type: boolean
          required:
            - accessToken
            - refreshToken
            - tokenType
            - expiresIn
            - status
            - mfaEnrollmentRequired
        - type: object
          properties:
            status:
              type: string
              const: mfa_required
            mfaToken:
              type: string
            expiresIn:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          required:
            - status
            - mfaToken
            - expiresIn
    SlotInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        doctorId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        startsAt:
          type: string
        endsAt:
          type: string
        status:
          type: string
          enum:
            - available
            - held
            - booked
            - blocked
      required:
        - id
        - doctorId
        - startsAt
        - endsAt
        - status
    ConsultationInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        status:
          type: string
          enum:
            - pending_payment
            - confirmed
            - in_progress
            - completed
            - cancelled
            - no_show
        patientId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        patientName:
          type:
            - string
            - "null"
        doctorId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        doctorName:
          type:
            - string
            - "null"
        slotId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        scheduledAt:
          type: string
        endsAt:
          type: string
        feePaise:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        reason:
          type:
            - string
            - "null"
        notes:
          type:
            - string
            - "null"
        startedAt:
          type:
            - string
            - "null"
        completedAt:
          type:
            - string
            - "null"
        cancelledAt:
          type:
            - string
            - "null"
        cancelReason:
          type:
            - string
            - "null"
        paymentStatus:
          type:
            - string
            - "null"
        version:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - id
        - status
        - patientId
        - patientName
        - doctorId
        - doctorName
        - slotId
        - scheduledAt
        - endsAt
        - feePaise
        - reason
        - notes
        - startedAt
        - completedAt
        - cancelledAt
        - cancelReason
        - paymentStatus
        - version
    BookingInput:
      type: object
      properties:
        consultation:
          $ref: "#/components/schemas/ConsultationInput"
        payment:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            status:
              type: string
            amountPaise:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            currency:
              type: string
            provider:
              type: string
            orderId:
              type: string
          required:
            - id
            - status
            - amountPaise
            - currency
            - provider
            - orderId
        holdExpiresAt:
          type: string
      required:
        - consultation
        - payment
        - holdExpiresAt
    DoctorInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        displayName:
          type: string
        specialties:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string
        qualifications:
          type: array
          items:
            type: string
        yearsExperience:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        feePaise:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        city:
          type:
            - string
            - "null"
        bio:
          type:
            - string
            - "null"
        rating:
          type: number
        ratingCount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        verified:
          type: boolean
        nextAvailableAt:
          type:
            - string
            - "null"
      required:
        - id
        - displayName
        - specialties
        - languages
        - qualifications
        - yearsExperience
        - feePaise
        - city
        - bio
        - rating
        - ratingCount
        - verified
        - nextAvailableAt
    PaymentInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        consultationId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        status:
          type: string
        amountPaise:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        currency:
          type: string
        provider:
          type: string
        orderId:
          type:
            - string
            - "null"
        capturedAt:
          type:
            - string
            - "null"
        refundedAt:
          type:
            - string
            - "null"
      required:
        - id
        - consultationId
        - status
        - amountPaise
        - currency
        - provider
        - orderId
        - capturedAt
        - refundedAt
    PrescriptionInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        consultationId:
          type: string
          format: uuid
