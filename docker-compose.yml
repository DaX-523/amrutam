# Local stack — 100% free/open-source images, nothing cloud-billed.
#   docker compose up -d            # infra + api + worker
#   open http://localhost:3000/docs (Swagger) · http://localhost:8025 (Mailpit)
x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgres://amrutam:amrutam@postgres:5432/amrutam
  REDIS_URL: redis://redis:6379
  JWT_SIGNING_KEYS: ${JWT_SIGNING_KEYS}
  JWT_ACTIVE_KID: ${JWT_ACTIVE_KID}
  ENCRYPTION_KEYS: ${ENCRYPTION_KEYS}
  ENCRYPTION_ACTIVE_KEY_ID: ${ENCRYPTION_ACTIVE_KEY_ID}
  BLIND_INDEX_KEY: ${BLIND_INDEX_KEY}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
  MOCK_CHECKOUT_ENABLED: "true"
  S3_ENDPOINT: http://seaweedfs:8333
  S3_BUCKET: amrutam-prescriptions
  S3_ACCESS_KEY_ID: amrutam
  S3_SECRET_ACCESS_KEY: amrutam-dev-secret
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amrutam
      POSTGRES_PASSWORD: amrutam
      POSTGRES_DB: amrutam
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements
               -c log_min_duration_statement=200
               -c max_connections=200
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amrutam -d amrutam"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6380:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (Apache-2.0). Stands in for AWS S3 locally at zero cost.
  seaweedfs:
    image: chrislusf/seaweedfs:3.93
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=10
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./infra/compose/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]

  migrate:
    build: { context: ., dockerfile: infra/docker/Dockerfile }
    image: amrutam-api:local
    command: ["node", "dist/db/migrate.js"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: amrutam-api:local
    command: ["node", "--import", "./dist/infra/telemetry.js", "dist/server.js"]
    environment:
      <<: *app-env
      SERVICE_NAME: amrutam-api
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    image: amrutam-api:local
    command: ["node", "--import", "./dist/infra/telemetry.js", "dist/worker.js"]
    environment:
      <<: *app-env
      SERVICE_NAME: amrutam-worker
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  s3data:
